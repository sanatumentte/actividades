<title>Actividades Sana tu Mentte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Caveat:wght@600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root{
    --petroleo:#165a6c; --verde:#047578; --salvia:#81a9a7; --arena:#dabb81; --beige:#e7decf;
    --crema:#f5e8da; --terracota:#c9987c; --papel:#fbf6ef; --tinta:#1f3d45; --suave:#5d7a7f;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--papel);color:var(--tinta);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55}
  .app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100%}
  .scene{position:relative;overflow:hidden;background:var(--petroleo);min-height:100%}
  .scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .scard{position:absolute;left:50%;top:14%;translate:-50% 0;width:min(78%,300px);background:#fff;color:var(--petroleo);border:1px solid var(--beige);border-radius:16px;padding:12px 16px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.18)}
  .scard.dark{background:#0f2f38;color:var(--crema);border-color:#2a5a66}
  .scard .st{font-weight:700;font-size:.98rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .scard .sl{border-top:1px solid currentColor;opacity:.6;margin-top:8px;padding-top:6px;font-size:.75rem}
  .panel{display:flex;flex-direction:column;padding:28px clamp(18px,5vw,64px);
    background:radial-gradient(circle at 20% 10%,rgba(218,187,129,.14),transparent 45%),radial-gradient(circle at 90% 90%,rgba(129,169,167,.16),transparent 45%),var(--papel)}
  .top{display:flex;align-items:center;gap:14px;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--petroleo);font-size:.9rem;letter-spacing:.02em}
  .brand img{width:44px;height:auto}
  .bar{display:flex;gap:6px;flex:1;max-width:260px}
  .bar i{flex:1;height:6px;border-radius:6px;background:var(--beige);transition:background .4s}
  .bar i.on{background:var(--salvia)}
  .count{font-size:.8rem;color:var(--suave);font-weight:700;min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
  .body{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:620px;width:100%;margin:0 auto;padding-block:28px}
  .eyebrow{font-family:"Caveat",cursive;font-size:1.55rem;color:var(--terracota);line-height:1}
  h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;color:var(--petroleo);font-size:clamp(2rem,4.2vw,3rem);line-height:1.08;margin:.2em 0 .35em;text-wrap:balance}
  h2{font-family:"DM Serif Display",Georgia,serif;font-weight:400;color:var(--petroleo);font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.15;margin:.15em 0 .5em;text-wrap:balance}
  .lead{color:var(--suave);font-size:1.05rem;max-width:52ch}
  .instr{background:#fff;border:1px solid var(--beige);border-radius:14px;padding:10px 14px;color:var(--suave);font-size:.92rem;margin-bottom:14px}
  textarea{width:100%;min-height:170px;resize:vertical;border:2px solid var(--beige);border-radius:18px;background:#fff;padding:16px 18px;font:inherit;color:var(--tinta);outline:none;transition:border-color .2s,box-shadow .2s}
  textarea:focus{border-color:var(--salvia);box-shadow:0 0 0 5px rgba(129,169,167,.2)}
  .cnt{text-align:right;font-size:.78rem;color:var(--suave);margin-top:4px;font-variant-numeric:tabular-nums}
  .opts{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--beige);background:#fff;border-radius:16px;padding:13px 16px;font:inherit;color:var(--tinta);cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
  .opt:hover{border-color:var(--salvia)}
  .opt:focus-visible,.btn:focus-visible{outline:3px solid var(--arena);outline-offset:2px}
  .opt.sel{border-color:var(--verde);background:#e8f3f1}
  .opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--salvia);flex:none;display:grid;place-items:center}
  .opt.sel .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--verde)}
  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
  .btn{border:none;border-radius:999px;padding:13px 26px;font:inherit;font-weight:800;cursor:pointer;transition:transform .1s,background .2s}
  .btn:active{transform:translateY(1px)}
  .btn.pri{background:var(--arena);color:#3a2a0c;box-shadow:0 6px 18px rgba(218,187,129,.45)}
  .btn.pri:hover{background:#d0ae6f}
  .btn.sec{background:transparent;color:var(--petroleo);border:2px solid var(--beige)}
  .btn.teal{background:var(--verde);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .slide{background:#fff;border-radius:22px;padding:26px 24px;border:1px solid var(--beige);font-size:1.18rem;line-height:1.6;box-shadow:0 10px 30px rgba(22,90,108,.08)}
  .code{font-family:ui-monospace,Consolas,monospace;font-size:.72rem;word-break:break-all;background:#fff;border:2px dashed var(--salvia);border-radius:14px;padding:12px;max-height:120px;overflow:auto;color:var(--suave);user-select:all}
  .steps{display:grid;gap:12px;margin:14px 0}
  .stp{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:16px;padding:14px 16px;border:1px solid var(--beige)}
  .stp b.n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--salvia);color:#fff;display:grid;place-items:center;font-size:.9rem}
  .note{background:#fdf0ea;border:1px solid #efd3c4;color:#7a4a33;border-radius:14px;padding:12px 14px;font-size:.93rem;margin:12px 0}
  .ok{color:var(--verde);font-weight:800}
  .foot{font-size:.75rem;color:var(--suave);text-align:center;margin-top:10px}
  @media (max-width:860px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .scene{min-height:0;height:34vh;max-height:300px}
    .scard{top:50%;translate:-50% -50%}
    .panel{padding:18px 16px}
    .body{justify-content:flex-start;padding-block:18px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .float{animation:floaty 5s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
  .tw{animation:twinkle 3.5s ease-in-out infinite}
</style>

  {titulo:'Cómo funciona tu mente',slides:['Lo que sentimos no depende solo de lo que pasa, sino de cómo lo interpretamos en ese momento.','Hay cuatro piezas conectadas: la situación, lo que pensamos en automático, lo que sentimos (emoción y cuerpo) y lo que hacemos.','Ejemplo: un mensaje sin responder. Pensar «no le importo» o «debe estar ocupada» produce emociones y conductas distintas.','Esos pensamientos que aparecen solos, casi sin darnos cuenta, se llaman pensamientos automáticos.','Debajo suele haber «reglas» y creencias más antiguas sobre uno mismo, los demás y el mundo. No son datos: son aprendizajes.','No se trata de «pensar positivo», sino de aprender a revisar si el pensamiento es preciso y útil.','Practicar esto es el primer paso de casi todo el trabajo en terapia.']},
  {titulo:'Revisar un pensamiento',slides:['No todos los pensamientos automáticos son verdad, aunque se sientan muy reales.','Paso 1: identifica el pensamiento exacto. ¿Qué pasó por tu mente justo antes de sentirte así?','Paso 2: ¿qué tan fuerte lo crees (0–100 %) y qué emoción produjo?','Paso 3: busca evidencia a favor y en contra, como una investigadora imparcial de tu propia mente.','Paso 4: pregúntate «¿qué le diría a una amiga que piensa esto?» o «¿hay otra forma de verlo?».','Paso 5: construye una respuesta más equilibrada: realista, no forzadamente positiva.','Vuelve a calificar cuánto crees el pensamiento y cómo te sientes. Con práctica se vuelve un hábito.']},
  {titulo:'El círculo de la ansiedad',slides:['La ansiedad avisa de una amenaza, pero a veces exagera el peligro y subestima nuestra capacidad de afrontarlo.','Cuando algo nos da miedo, lo natural es evitarlo: el malestar baja rápido… por un momento.','Evitar le enseña al cerebro «eso era peligroso», y la próxima vez el miedo es igual o mayor.','Se forma un círculo: miedo → evitación → alivio momentáneo → más miedo a largo plazo.','La ansiedad tiene cuatro caras: física, mental, conductual y emocional.','Romper el círculo no es «no sentir miedo»: es acercarse poco a poco a lo temido, hasta que el cuerpo aprenda que puede tolerarlo.','Esta es la base de la exposición gradual, una de las técnicas con más evidencia para la ansiedad.']},
  {titulo:'Activación: salir del círculo',slides:['Cuando estamos tristes dejamos de hacer cosas porque «no hay ganas»; pero las ganas muchas veces vuelven después de actuar.','Se forma un círculo: menos actividad → menos logro y placer → peor ánimo → menos actividad.','La estrategia no es esperar la motivación, sino programar actividades pequeñas y concretas.','Elige actividades que den logro (ordenar un cajón) y otras que den placer (escuchar música).','Regístralas: qué hiciste, cuándo, y cuánto logro y placer te dio (0–10).','Comparar lo que creías que sentirías con lo que sentiste ayuda a corregir el pesimismo.','Empieza con metas pequeñas: el ánimo mejora en pasos, no de golpe.']},
  {titulo:'Tú no eres tus pensamientos',slides:['A veces nos «fusionamos» con un pensamiento: lo tratamos como un hecho («soy un fracaso» = verdad absoluta).','La defusión es ver el pensamiento como lo que es: un evento mental, no una orden ni un veredicto.','Truco: en vez de «soy un fracaso», di «estoy teniendo el pensamiento de que soy un fracaso».','Otro truco: repite la palabra clave en voz alta 20 o 30 veces; suele perder su peso.','Imagina tus pensamientos como hojas en un río: los ves pasar sin subirte a cada una.','Defusionarte no elimina el pensamiento; cambia tu relación con él.','Es una habilidad: se practica poco a poco.']},
  {titulo:'Valores: tu brújula',slides:['Los valores no son metas que se cumplen: son direcciones en las que quieres caminar.','Una meta se alcanza y se cierra; un valor guía el camino de forma continua.','Los valores no dependen de la aprobación de otros ni de que todo salga bien: son elegidos.','Pregúntate: «en este momento, ¿qué es lo que realmente me importa?».','Explóralos por áreas: familia, pareja, amistad, trabajo, salud, ocio, crecimiento, fe.','Puedes actuar según tus valores incluso sintiendo miedo o tristeza.','Cuando has vivido muchas decepciones, reconocer tus valores cuesta más, porque valorar implica volver a exponerse.']},
  {titulo:'Mindfulness: observar sin engancharte',slides:['Mindfulness es prestar atención al presente, con curiosidad y sin juzgar lo que aparece.','La mente tiende a viajar al pasado o al futuro. Mindfulness es notarlo y volver, con amabilidad.','Práctica: observa tu respiración un minuto; cuando la mente se distraiga, vuelve al aire que entra y sale.','No es relajarse a toda costa ni «vaciar la mente»; a veces hace más visible el malestar, y eso también es parte.','Practicar unos minutos con frecuencia ayuda más que hacerlo perfecto una vez.','Es una habilidad, como aprender un idioma: mejora con la repetición.']},
  {titulo:'Autocompasión',slides:['Muchas veces tenemos un crítico interno muy duro, que jamás usaríamos con alguien que queremos.','Autocompasión no es lástima ni «dejarse pasar todo»: es reconocer tu dolor sin juzgarlo.','Tiene tres partes: darte cuenta de que sufres, recordar que sufrir es humano y tratarte con amabilidad.','Ser dura contigo no aumenta la disciplina; suele aumentar la evitación y la desesperanza.','Ejercicio: cuando notes autocrítica, pregúntate «¿qué le diría a alguien querido?» y dítelo a ti.','La autocompasión no reemplaza el cambio: lo acompaña sin la carga del castigo.','Puede sentirse incómodo al principio, sobre todo si aprendiste que exigirte era la única forma de mejorar.']}
];

function wrapTxt(t,n){ t=String(t||'').trim(); if(!t) return []; const w=t.split(/\s+/), L=[]; let l='';

  return L.length>3? L.slice(0,3).map((x,i)=>i===2?x.slice(0,n-1)+'…':x) : L; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function estrellas(n){ let s=''; for(let i=0;i<n;i++){ const x=(i*97+31)%400, y=(i*53+17)%170; s+=`<circle class="tw" style="animation-delay:${(i%7)*.5}s" cx="${x}" cy="${y}" r="${i%3?1.2:1.8}" fill="#f5e8da"/>`; } return s; }

/* ---------- Asistente de un registro (paso a paso) ----------
   reWizard(cont, entrada|null, {onSave(entrada), onCancel(), onStep(paso,total)}) */
const RE_PASOS=6, RE_ORDEN=['sit','pen','em','int','rea','cue'];   // el pensamiento va de segundo; lo corporal al final
function reWizard(cont, ent, cb){
  reCss(); cb=cb||{};
  const E=ent? JSON.parse(JSON.stringify(ent)) : {f:reHoy(),sit:'',em:[],fis:[],fisOtro:'',rea:[],hice:'',dur:'',pen:'',cree:5};
  let paso=0, famAbierta=(E.em[0]&&E.em[0].fam)||'';
  const tog=(arr,v)=>{ const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); };
  const nav=(okTxt,dis)=>`<div class="re-nav"><button type="button" class="re-btn sec" data-re="prev">${paso===0?'Cancelar':'← Anterior'}</button><button type="button" class="re-btn pri" data-re="next" ${dis?'disabled':''}>${okTxt||(paso===RE_PASOS-1?'Guardar registro ✓':'Siguiente →')}</button></div>`;
  const slider=(id,lab,val,c,izq,der)=>`<div class="re-sl"><div class="top"><span>${lab}</span><span class="val" id="${id}v" style="color:${c||'#165a6c'}">${val}</span></div>
    <input type="range" class="re-range" min="1" max="10" step="1" value="${val}" id="${id}" style="accent-color:${c||'#047578'}"><div class="re-scale"><span>1 · ${izq||'muy poco'}</span><span>10 · ${der||'muchísimo'}</span></div></div>`;
  function draw(){
    if(cb.onStep) cb.onStep(paso,RE_PASOS,E);
    const id=RE_ORDEN[paso], N=paso+1;
    let h='';
    if(id==='sit'){
      h=`<div class="re-ey">Paso ${N} de ${RE_PASOS}</div><h2 class="re-q">¿Qué pasó?</h2>
        <p class="re-sub">Describe la situación: dónde estabas, con quién, qué ocurrió.</p>
        <label class="re-sub" style="display:flex;align-items:center;gap:8px;margin-bottom:8px">📅 Fecha <input type="date" class="re-in" id="reF" value="${reEsc(E.f)}" max="${reHoy()}"></label>
        <textarea class="re-ta" id="reSit" maxlength="800" placeholder="Ej.: En el trabajo, mi jefe me corrigió delante de todos…">${reEsc(E.sit)}</textarea>${nav('',!E.sit.trim())}`;
    } else if(id==='em'){
      const F=famAbierta? reFam(famAbierta) : null;
      h=`<div class="re-ey">Paso ${N} de ${RE_PASOS}</div><h2 class="re-q">¿Qué emociones sentiste?</h2>
        <p class="re-sub">Toca una familia y elige las emociones que más se parezcan a lo que sentiste. Puedes elegir varias, incluso de familias distintas.</p>
        <div class="re-sel">${E.em.length? E.em.map((e,i)=>{ const G=reFam(e.fam); return `<span class="re-emchip" style="background:${G.bg};color:${G.c};border-color:${G.c}55">${G.ic} ${reEsc(e.n)}<button type="button" class="re-x" data-quitar="${i}" aria-label="Quitar ${reEsc(e.n)}">×</button></span>`; }).join('') : '<span class="vacio">Aquí aparecerán las emociones que elijas</span>'}</div>
        <div class="re-fams">${RE_FAM.map(f=>{ const n=E.em.filter(e=>e.fam===f.k).length; return `<button type="button" class="re-fam${famAbierta===f.k?' on':''}" data-fam="${f.k}" style="background:${f.bg};color:${f.c}"><span class="i">${f.ic}</span>${f.n}${n?`<span class="n">${n} elegida${n>1?'s':''}</span>`:''}</button>`; }).join('')}</div>
        ${F? `<div class="re-chips">${F.em.map(n=>{ const on=E.em.some(e=>e.n===n); return `<button type="button" class="re-chip${on?' on':''}" data-em="${reEsc(n)}" style="${on?`background:${F.c};border-color:${F.c}`:''}">${reEsc(n)}</button>`; }).join('')}</div>` : ''}
        <p class="re-sub" style="margin:10px 0 4px">💬 ¿No encuentras tu emoción? Escríbela con tus palabras:</p>
        <div class="re-otra"><input class="re-in" id="reOtra" maxlength="40" placeholder="Ej.: me sentí invisible"><button type="button" class="re-btn sec" id="reOtraAdd" style="padding:9px 16px">Agregar</button></div>
        ${nav('',!E.em.length)}`;
    } else if(id==='int'){
      h=`<div class="re-ey">Paso ${N} de ${RE_PASOS}</div><h2 class="re-q">¿Qué tan intensa fue cada una?</h2>
        <p class="re-sub">Mueve la barra: 1 es muy suave y 10 muy intensa.</p>
        ${E.em.map((e,i)=>{ const F=reFam(e.fam); if(!e.i) e.i=5; return slider('reI'+i,`${F.ic} <b>${reEsc(e.n)}</b>`,e.i,F.c,'muy suave','muy intensa'); }).join('')}${nav()}`;
    } else if(id==='cue'){
      h=`<div class="re-ey">Paso ${N} de ${RE_PASOS}</div><h2 class="re-q">¿Qué sentiste en tu cuerpo?</h2>
        <p class="re-sub">Toca todo lo que notaste. Si fue otra cosa, escríbela abajo.</p>
        <div class="re-chips">${RE_CUERPO.map(n=>`<button type="button" class="re-chip${E.fis.includes(n)?' on':''}" data-fis="${reEsc(n)}">${reEsc(n)}</button>`).join('')}</div>
        <input class="re-in" id="reFisO" style="width:100%" maxlength="200" placeholder="Otra sensación (opcional)" value="${reEsc(E.fisOtro)}">${nav()}`;
    } else if(id==='rea'){
      h=`<div class="re-ey">Paso ${N} de ${RE_PASOS}</div><h2 class="re-q">¿Qué hiciste en ese momento?</h2>
        <p class="re-sub">Puedes tocar alguna opción y contarlo con tus palabras.</p>
        <div class="re-chips">${RE_REACC.map(n=>`<button type="button" class="re-chip${E.rea.includes(n)?' on':''}" data-rea="${reEsc(n)}">${reEsc(n)}</button>`).join('')}</div>
        <textarea class="re-ta" id="reHice" style="min-height:90px" maxlength="600" placeholder="¿Cómo actuaste o qué hiciste?">${reEsc(E.hice)}</textarea>
        <p class="re-sub" style="margin:12px 0 4px"><b>¿Cuánto tiempo duró?</b></p>
        <div class="re-chips">${RE_DUR.map(n=>`<button type="button" class="re-chip${E.dur===n?' on':''}" data-dur="${reEsc(n)}">${reEsc(n)}</button>`).join('')}</div>${nav()}`;
    } else {
      h=`<div class="re-ey">Paso ${N} de ${RE_PASOS}</div><h2 class="re-q">¿Qué pasó por tu mente?</h2>
        <p class="re-sub">Escribe el pensamiento tal como apareció, con las mismas palabras.</p>
        <textarea class="re-ta" id="rePen" maxlength="600" placeholder="Ej.: «Todos piensan que no sirvo para esto»">${reEsc(E.pen)}</textarea>
        ${slider('reCree','¿Qué tanto crees en ese pensamiento?',E.cree||5,'#165a6c','nada','totalmente')}${nav()}`;
    }
    cont.innerHTML=`<div class="re-wrap">${h}</div>`;
    const q=s=>cont.querySelector(s), qa=s=>cont.querySelectorAll(s), nextBtn=q('[data-re="next"]');
    if(id==='sit'){ const ta=q('#reSit'); ta.focus(); ta.addEventListener('input',()=>{ E.sit=ta.value; nextBtn.disabled=!ta.value.trim(); }); q('#reF').addEventListener('change',e=>{ E.f=e.target.value||reHoy(); }); }
    if(id==='em'){
      qa('[data-fam]').forEach(b=>b.onclick=()=>{ famAbierta=famAbierta===b.dataset.fam?'':b.dataset.fam; draw(); });
      qa('[data-em]').forEach(b=>b.onclick=()=>{ const n=b.dataset.em, i=E.em.findIndex(e=>e.n===n); if(i>=0) E.em.splice(i,1); else E.em.push({n,fam:famAbierta,i:5}); draw(); });
      qa('[data-quitar]').forEach(b=>b.onclick=()=>{ E.em.splice(+b.dataset.quitar,1); draw(); });
      const ot=q('#reOtra'), addOtra=()=>{ const n=ot.value.trim().replace(/\s+/g,' '); if(!n) { ot.focus(); return; }
        if(!E.em.some(e=>e.n.toLowerCase()===n.toLowerCase())) E.em.push({n:n.charAt(0).toUpperCase()+n.slice(1),fam:'otra',i:5}); draw(); };
      q('#reOtraAdd').onclick=addOtra; ot.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addOtra(); } });
    }
    qa('.re-range').forEach(r=>r.addEventListener('input',()=>{ const v=+r.value; q('#'+r.id+'v').textContent=v;
      if(r.id==='reCree') E.cree=v; else E.em[+r.id.slice(3)].i=v; }));
    if(id==='cue'){ qa('[data-fis]').forEach(b=>b.onclick=()=>{ tog(E.fis,b.dataset.fis); b.classList.toggle('on'); }); q('#reFisO').addEventListener('input',e=>{ E.fisOtro=e.target.value; }); }
    if(id==='rea'){ qa('[data-rea]').forEach(b=>b.onclick=()=>{ tog(E.rea,b.dataset.rea); b.classList.toggle('on'); });
      q('#reHice').addEventListener('input',e=>{ E.hice=e.target.value; });
      qa('[data-dur]').forEach(b=>b.onclick=()=>{ E.dur=E.dur===b.dataset.dur?'':b.dataset.dur; draw(); }); }
    if(id==='pen'){ const ta=q('#rePen'); ta.focus(); ta.addEventListener('input',()=>{ E.pen=ta.value; }); }
    q('[data-re="prev"]').onclick=()=>{ if(paso===0){ if(cb.onCancel) cb.onCancel(); } else { paso--; draw(); } };
    nextBtn.onclick=()=>{ if(paso<RE_PASOS-1){ paso++; draw(); } else if(cb.onSave) cb.onSave(E); };
  }
  draw();
}

/* ---------- Resumen de la semana ---------- */
function reResumen(L){
  reCss(); L=L||[];
  const cuenta={}, fams={}, famDe={}; let suma=0, n=0;
  L.forEach(r=>(r.em||[]).forEach(e=>{ cuenta[e.n]=(cuenta[e.n]||0)+1; famDe[e.n]=e.fam; fams[e.fam]=(fams[e.fam]||0)+1; if(e.i){ suma+=+e.i; n++; } }));
  const top=Object.keys(cuenta).sort((a,b)=>cuenta[b]-cuenta[a]).slice(0,5), max=top.length? cuenta[top[0]] : 1;
  const famTop=Object.keys(fams).sort((a,b)=>fams[b]-fams[a])[0];
  return `<div class="re-wrap"><div class="re-stats">
      <div class="re-stat"><b>${L.length}</b><span>registro${L.length===1?'':'s'}</span></div>
      <div class="re-stat"><b>${n? (Math.round(suma/n*10)/10) : '—'}</b><span>intensidad promedio (1–10)</span></div>
      <div class="re-stat"><b>${famTop? reFam(famTop).ic : '—'}</b><span>${famTop? 'la familia que más apareció: '+reFam(famTop).n : 'sin emociones aún'}</span></div></div>
    ${top.length? `<p class="re-sub" style="margin:10px 0 4px"><b>Las emociones que más aparecieron</b></p>${top.map(t=>{ const F=reFam(famDe[t]); return `<div class="re-bar"><span style="min-width:110px">${F.ic} ${reEsc(t)}</span><span class="b" style="width:${Math.max(8,cuenta[t]/max*60)}%;background:${F.c}"></span><b>${cuenta[t]}</b></div>`; }).join('')}`:''}</div>`;
}
/* Tarjeta corta de un registro (lista del paciente y de la app) */
function reTarjeta(r,i,acciones){
  return `<div class="re-card"><div class="d"><span>${reEsc(reFechaLarga(r.f))}</span>${acciones?`<span><button type="button" class="re-mini" data-edit="${i}">Editar</button> · <button type="button" class="re-mini" data-del="${i}">Borrar</button></span>`:''}</div>
    <div class="s">${reEsc(String(r.sit||'').slice(0,140))}${String(r.sit||'').length>140?'…':''}</div><div>${(r.em||[]).map(reChipEm).join('')}</div></div>`;
}
/* Tabla como su formato de papel (para la app) */
function reTabla(L){
  reCss();
  return `<div style="overflow-x:auto"><table class="re-tabla"><thead><tr><th>Fecha</th><th>Situación</th><th>Pensamientos</th><th>¿Cuánto lo cree? (1–10)</th><th>Emociones · intensidad (1–10)</th><th>Reacción · duración</th><th>Respuestas físicas</th></tr></thead><tbody>
    ${(L||[]).map(r=>`<tr><td><b>${reEsc(reFechaLarga(r.f))}</b></td><td>${reEsc(r.sit)}</td><td>${reEsc(r.pen)||'—'}</td><td style="text-align:center"><b>${r.cree||'—'}</b></td><td>${(r.em||[]).map(reChipEm).join('<br>')}</td>
      <td>${reEsc([...(r.rea||[]),r.hice].filter(Boolean).join('. '))||'—'}${r.dur?`<br><span style="color:#5d7a7f">⏱ ${reEsc(r.dur)}</span>`:''}</td>

const partes=decodeURIComponent((location.hash||'').slice(1)).split('.');

const KEY='sana_'+A.token;
try{ const d=JSON.parse(localStorage.getItem(KEY)||'null'); if(d&&Array.isArray(d.r)){ R=d.r; } }catch(_){}

let RG=[], rgModo='home', rgEdit=null, rgSel=[];
try{ const d=JSON.parse(localStorage.getItem(KEY)||'null'); if(d&&Array.isArray(d.reg)) RG=d.reg; }catch(_){}

function escenaEmociones(selExtra){
  const cnt={}; RG.forEach(r=>(r.em||[]).forEach(e=>{ cnt[e.fam]=(cnt[e.fam]||0)+1; })); (selExtra||[]).forEach(e=>{ cnt[e.fam]=(cnt[e.fam]||0)+1; });

    ${burb}</svg>`;
}

      try{ navigator.clipboard.writeText(msg).then(ok,()=>{ $('details').open=true; $('#okc').textContent='Selecciona el texto de abajo y cópialo.'; }); }catch(_){ $('details').open=true; } };

    if($('#dxWa')) $('#dxWa').addEventListener('click',marcar);
    $('#copiar').onclick=()=>{ const ok=()=>{ marcar(); $('#okc').textContent='✓ Copiado. Ahora pégalo en WhatsApp.'; };
      try{ navigator.clipboard.writeText(msg).then(ok,()=>{ $('details').open=true; $('#okc').textContent='Selecciona el texto de abajo y cópialo.'; }); }catch(_){ $('details').open=true; } };
    return;
  }
  const dias=[...Array(14)].map((_,i)=>{ const d=new Date(); d.setDate(d.getDate()-13+i); const f=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const e=DX.find(x=>x.f===f); return `<div class="dx-dia"><i style="${e?`background:${DX_COL[e.n].c};border:2px solid ${DX_COL[e.n].c}`:''}"></i>${RE_DIAS[d.getDay()].slice(0,2)}</div>`; }).join('');
  const pend=DX.filter(x=>!x.env).length;
  b.innerHTML=dxSos()+`<div class="eyebrow">Un minuto para ti</div><h1>Mi chequeo diario</h1>
    <p class="lead">Unas preguntas cortas para darte cuenta de cómo estás hoy y saber qué hacer.</p>
    <div class="dx-aviso">🔒 ${esc(DX_AVISO)}</div>
    ${hoyE?`<div class="dx-hoy" style="background:${DX_COL[hoyE.n].bg};border-color:${DX_COL[hoyE.n].c}"><span class="e">${DX_COL[hoyE.n].ic}</span><div style="flex:1"><b>Hoy ya hiciste tu chequeo</b><br><span style="font-size:.9rem">Ánimo ${hoyE.an}/10</span></div><button class="btn sec" id="dxVer" style="padding:9px 16px">Ver qué hacer</button></div>`:''}
    ${DX.length?`<p class="re-sub" style="margin:12px 0 0"><b>Tus últimos 14 días</b></p><div class="dx-dias">${dias}</div>`:''}
    <div class="nav"><button class="btn pri" id="dxGo">${hoyE?'✏️ Actualizar el de hoy':'☀️ Hacer mi chequeo de hoy'}</button>${DX.length?`<button class="btn teal" id="dxEnv">📲 Enviar${pend?` (${pend} nuevo${pend>1?'s':''})`:''}</button>`:''}</div>
    <p class="foot" style="text-align:left">💡 Abre siempre este mismo enlace, desde el mismo celular y navegador (no en modo incógnito): tus días quedan guardados ahí.</p>
    <details style="margin-top:6px"><summary class="foot" style="text-align:left;cursor:pointer">📞 Mis líneas de crisis (${esc(dxRegion().n)})</summary>${dxLineas(false)}</details>`;
  $('#dxGo').onclick=()=>{ dxE=hoyE? JSON.parse(JSON.stringify(hoyE)) : {f:reHoy(),est:[]}; if(!Array.isArray(dxE.est)) dxE.est=[]; dxPaso=0; dxModo='wiz'; renderDiario(); };
  if($('#dxVer')) $('#dxVer').onclick=()=>{ dxModo='res'; renderDiario(); };
  if($('#dxEnv')) $('#dxEnv').onclick=()=>{ dxModo='enviar'; renderDiario(); };
}

function pintarBarra(){
  const tot=D?D.pasos.length:0, bar=$('#bar');
  if(!D||paso<0||paso>=tot){ bar.innerHTML=''; $('#count').textContent=''; return; }
  const seg=Math.min(tot,12); bar.innerHTML=[...Array(seg)].map((_,i)=>`<i class="${(i+1)/seg<=(paso+1)/tot+1e-9?'on':''}"></i>`).join('');
  $('#count').textContent=`${paso+1} / ${tot}`;
}
function pintarEscena(){
  if(!D){ $('#scene').innerHTML=escena('papel',0); return; }
  const tot=D.pasos.length, prog=paso<0?0:(paso>=tot?1:paso/(tot-1||1));
  const p=D.pasos[Math.min(Math.max(paso,0),tot-1)];
  const ult=[...R].slice(0,Math.max(paso,0)+1).reverse().find(x=>typeof x==='string'&&x.trim());
  const txt=D.escena==='jardin'||D.escena==='papel'?'':(paso>=0&&paso<tot&&typeof R[paso]==='string'&&R[paso].trim()?R[paso]:(ult||''));
  const lab=paso>=0&&paso<tot&&p&&p.k==='txt'? ((p.q.split(/[:?]/)[0]||'').slice(0,26)) : '';
  const oscuro=D.escena==='rio'||D.escena==='brujula', sinCard=D.escena==='nube'||D.escena==='jardin'||D.escena==='papel';
  $('#scene').innerHTML=escena(D.escena,prog,txt,lab)+(!sinCard&&String(txt).trim()?`<div class="scard float${oscuro?' dark':''}"><div class="st">${esc(String(txt).slice(0,160))}${String(txt).length>160?'…':''}</div>${lab?`<div class="sl">${esc(lab)}</div>`:''}</div>`:'');
}
function render(){
  if(D&&D.especial) return A.tipo==='d'? renderDiario() : renderReg();
  pintarBarra(); pintarEscena();
  const b=$('#body');
  if(!D){ b.innerHTML=`<div class="eyebrow">Hola</div><h1>Este enlace está incompleto</h1><p class="lead">Pídele a tu psicóloga que te envíe de nuevo el enlace de la actividad.</p>`; return; }
  const tot=D.pasos.length;
  if(paso<0){
    b.innerHTML=`<div class="eyebrow">${esc(D.eyebrow)}</div><h1>${esc(D.titulo)}</h1><p class="lead">${esc(D.intro)}</p>
      <div class="steps"><div class="stp"><b class="n">1</b><span>Tómate tu tiempo. Puedes volver atrás cuando quieras.</span></div>
      <div class="stp"><b class="n">2</b><span>Escribe con tus palabras: aquí no hay respuestas correctas.</span></div>
      <div class="stp"><b class="n">3</b><span>Al final envías tus respuestas a tu psicóloga.</span></div></div>
      <div class="nav"><span></span><button class="btn pri" id="go">${R.length?'Seguir donde iba →':'Comenzar →'}</button></div>`;
    $('#go').onclick=()=>{ paso=0; render(); }; $('#go').focus(); return;
  }
  if(paso>=tot) return final();
  const p=D.pasos[paso];
  if(p.k==='slide'){
    b.innerHTML=`<div class="eyebrow">${esc(D.titulo)}</div><div class="slide">${esc(p.q)}</div>
      <div class="nav"><button class="btn sec" id="prev">← Anterior</button><button class="btn pri" id="next">Siguiente →</button></div>`;
  } else if(p.k==='txt'){
    const v=typeof R[paso]==='string'?R[paso]:'';
    b.innerHTML=`<div class="eyebrow">Paso ${paso+1} de ${tot}</div><h2>${esc(p.q)}</h2>
      <textarea id="ta" maxlength="1000" placeholder="Escribe aquí…">${esc(v)}</textarea><div class="cnt" id="cnt">${v.length} / 1000</div>
      <div class="nav"><button class="btn sec" id="prev">← Anterior</button><button class="btn pri" id="next">${paso===tot-1?'Terminar →':'Siguiente →'}</button></div>`;
    const ta=$('#ta'); ta.focus();
    ta.addEventListener('input',()=>{ R[paso]=ta.value; guardar(); $('#cnt').textContent=ta.value.length+' / 1000'; clearTimeout(ta._t); ta._t=setTimeout(pintarEscena,350); });
  } else {
    b.innerHTML=`<div class="eyebrow">Pregunta ${paso+1} de ${tot}</div>${D.instr?`<div class="instr">${esc(D.instr)}</div>`:''}<h2>${esc(p.q)}</h2>
      <div class="opts" role="radiogroup">${p.opciones.map(([val,t])=>`<button type="button" role="radio" aria-checked="${R[paso]===val}" class="opt${R[paso]===val?' sel':''}" data-v="${val}"><span class="dot"></span><span>${esc(t)}</span></button>`).join('')}</div>
      <div class="nav"><button class="btn sec" id="prev">← Anterior</button><button class="btn pri" id="next" ${R[paso]==null?'disabled':''}>${paso===tot-1?'Terminar →':'Siguiente →'}</button></div>`;
    document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{ R[paso]=o.dataset.v; guardar(); document.querySelectorAll('.opt').forEach(x=>{ x.classList.toggle('sel',x===o); x.setAttribute('aria-checked',x===o); });
      $('#next').disabled=false; setTimeout(()=>{ if(paso<tot){ paso++; render(); } },280); });
  }
  $('#prev').onclick=()=>{ paso--; render(); };
  $('#next').onclick=()=>{ paso++; render(); };
}
function b64u(s){ const by=new TextEncoder().encode(s); let bin=''; by.forEach(x=>bin+=String.fromCharCode(x)); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function final(){
  pintarBarra();
  const tieneTexto=D.pasos.some((p,i)=>p.k!=='slide'&&R[i]!=null&&String(R[i]).trim()!=='');
  const faltan=D.pasos.map((p,i)=>(p.k==='opc'&&R[i]==null)?i:-1).filter(i=>i>=0);
  const b=$('#body');
  if(faltan.length){ b.innerHTML=`<div class="eyebrow">Casi listo</div><h2>Te faltan ${faltan.length} pregunta(s)</h2><p class="lead">Vuelve a la pregunta ${faltan[0]+1} para completarla.</p>
    <div class="nav"><button class="btn pri" id="ir">Ir a la pregunta ${faltan[0]+1}</button></div>`; $('#ir').onclick=()=>{ paso=faltan[0]; render(); }; return; }
  const riesgo=A.tipo==='t'&&ESCALAS[A.clave].riesgoItem!=null&&+R[ESCALAS[A.clave].riesgoItem]>0;
  const codigo='SANA1:'+b64u(JSON.stringify({v:1,t:A.token,k:A.tipo,c:A.clave,r:D.pasos.map((p,i)=>p.k==='slide'?null:(R[i]==null?'':R[i])),f:new Date().toISOString().slice(0,10)}));
  const msg=`🌿 Respuestas de «${D.titulo}»\n${codigo}`;
  b.innerHTML=`<div class="eyebrow">¡Lo lograste!</div><h1>Gracias por tomarte este momento</h1>
    ${riesgo?`<div class="note">Gracias por contarlo con honestidad; tu psicóloga lo va a leer. Si en este momento sientes que podrías hacerte daño, no esperes: llama a la línea de emergencias de tu país (en Colombia, el 123) o acude a urgencias.</div>`:''}
    ${tieneTexto||A.tipo!=='r'?`<p class="lead">Envíale tus respuestas a tu psicóloga en dos pasos:</p>
    <div class="steps">
      <div class="stp"><b class="n">1</b><div style="flex:1"><b>Copia tus respuestas</b><div class="nav" style="margin-top:8px"><button class="btn teal" id="copiar">📋 Copiar mis respuestas</button></div><div id="okc" class="ok" style="margin-top:6px"></div></div></div>
      <div class="stp"><b class="n">2</b><div style="flex:1"><b>O envíalas directo por WhatsApp</b>${A.tel?`<div class="nav" style="margin-top:8px"><a class="btn pri" style="text-decoration:none" href="https://api.whatsapp.com/send?phone=${A.tel}&text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">📲 Enviar por WhatsApp →</a></div><p class="foot" style="text-align:left">Su número: <b style="user-select:all">+${A.tel}</b></p>`:''}</div></div>
    </div>
    <details><summary class="foot" style="text-align:left;cursor:pointer">Si el botón de copiar no funciona, copia este texto</summary><div class="code" id="code">${esc(msg)}</div></details>`
    :`<p class="lead">Ya puedes cerrar esta página. Nos vemos en la próxima sesión 🌿</p>`}
    <div class="nav"><button class="btn sec" id="prev">← Revisar mis respuestas</button></div>`;
  $('#prev').onclick=()=>{ paso=D.pasos.length-1; render(); };
  if($('#copiar')) $('#copiar').onclick=()=>{ const ok=()=>{ $('#okc').textContent='✓ Copiado. Ahora pégalo en WhatsApp.'; };
    try{ navigator.clipboard.writeText(msg).then(ok,()=>{ $('details').open=true; const r=document.createRange(); r.selectNodeContents($('#code')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); $('#okc').textContent='Selecciona el texto de abajo y cópialo.'; }); }
    catch(_){ $('details').open=true; } };
  pintarEscena();
}
render();
</script>
