<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi kit emocional · Ábrelo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--mor:#9a6aa6;--mor2:#7d5590;--txt:#5d4a66;--beige:#eddac4;--fondo:#fbf6ef;--verde:#25a35a}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--txt);font:16px/1.45 Nunito,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid #eadfd2;position:sticky;top:0;z-index:5}
header img{height:38px}
header b{font:600 1.1rem Fredoka,sans-serif;color:var(--mor2)}
header small{display:block;color:#9a8aa0;font-size:.8rem}
main{max-width:520px;margin:0 auto;padding:14px 16px 40px}
h2{font:600 1.25rem Fredoka,sans-serif;color:var(--mor2);margin:18px 0 8px}
h3{font:600 1.05rem Fredoka,sans-serif;color:var(--mor2);margin:14px 0 6px}
.hint{color:#8a7a90;font-size:.9rem;margin:4px 0 10px}
.btn{border:0;border-radius:999px;padding:10px 16px;font:700 .95rem Nunito,sans-serif;cursor:pointer;background:var(--mor);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.sec{background:#fff;color:var(--mor2);border:1.5px solid #d9c6df}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn.wa{background:var(--verde)}
.btn:disabled{opacity:.45}
.fila{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
/* Sobres (portadas) */
.sobres{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sobre{border:0;padding:0;background:none;cursor:pointer;border-radius:14px;overflow:hidden;box-shadow:0 3px 10px #0001;text-align:left}
/* Página con el diseño del kit */
.pag{position:relative;width:100%;aspect-ratio:1238/1547;background-size:cover;background-position:center;container-type:inline-size;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #0001;--z:1}
.pag>img{width:100%;height:100%;object-fit:cover;display:block}
.txt{position:absolute;left:16%;right:16%;top:23%;bottom:11%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2.2cqw;font-family:Quicksand,sans-serif;color:var(--mor2);overflow:hidden}
.txt.scroll{justify-content:flex-start;overflow-y:auto}
.txt .t{font:700 calc(6.2cqw*var(--z))/1.1 Fredoka,sans-serif;color:var(--mor)}
.txt .p{font:500 calc(4.8cqw*var(--z))/1.4 Quicksand,sans-serif;white-space:pre-wrap}
.txt .vacio{font:500 calc(4.2cqw*var(--z))/1.4 Quicksand,sans-serif;color:#b49cbb;font-style:italic}
.txt .ref{font:700 calc(3.6cqw*var(--z)) Quicksand,sans-serif;color:var(--mor);background:#e3cfe7;border-radius:99px;padding:.4cqw 3cqw}
.txt .v{font:500 calc(4cqw*var(--z))/1.4 Quicksand,sans-serif}
.txt .sep{color:var(--mor);font-size:3.5cqw;letter-spacing:1cqw}
.txt .f{font:600 3.3cqw Quicksand,sans-serif;color:#a08aa8}
.txt .btn{font-size:3.8cqw;padding:2cqw 5cqw}
.portada .txt{left:12%;right:12%;top:37%;bottom:16%;justify-content:center;gap:4cqw}
.portada .abrelo{font:700 16cqw/1 Fredoka,sans-serif;color:var(--mor);letter-spacing:.02em}
.portada .cuando{font:600 9.5cqw/1.12 Fredoka,sans-serif;color:var(--mor);text-wrap:balance}
.marca{position:absolute;left:0;right:0;bottom:11.5%;text-align:center;font:600 3.4cqw Quicksand,sans-serif;letter-spacing:.06em;color:#a08aa8}
.portada.sesion .cuando{font:700 11cqw/1.1 Fredoka,sans-serif;color:var(--mor)}
.portada.sesion .f{font-size:4.2cqw}
.play{position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);white-space:nowrap;font-size:3.6cqw;padding:2cqw 5cqw;box-shadow:0 2px 8px #0002}
.editar{position:absolute;top:3%;right:4%;display:flex;gap:4px;z-index:2}
.editar button{border:0;background:#fffc;border-radius:99px;padding:5px 9px;cursor:pointer;font-size:.9rem}
/* Visor una a una */
.visor{position:relative}
.visorNav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.visorNav span{font-weight:700;color:var(--mor2)}
/* Menú de la carta: qué quiero hacer ahora */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opc{border:1.5px solid #e6d6ea;background:#fff;border-radius:18px;padding:14px 10px;cursor:pointer;text-align:center;font:700 .95rem Nunito,sans-serif;color:var(--txt)}
.opc i{display:block;font-style:normal;font-size:1.9rem;margin-bottom:4px}
.opc small{display:block;font-weight:600;color:#9a8aa0;font-size:.78rem;margin-top:2px}
.sentido{font:700 .8rem Nunito,sans-serif;color:#a08aa8;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
/* Secciones que se despliegan */
details.seccion{background:#fff;border:1.5px solid #e6d6ea;border-radius:18px;margin:10px 0;overflow:hidden}
details.seccion>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
details.seccion>summary::-webkit-details-marker{display:none}
details.seccion>summary i{font-style:normal;font-size:1.7rem}
details.seccion>summary span{flex:1;font:600 1.1rem Fredoka,sans-serif;color:var(--mor2)}
details.seccion>summary small{display:block;font:600 .8rem Nunito,sans-serif;color:#9a8aa0}
details.seccion .flecha{color:var(--mor);transition:transform .2s}
details.seccion[open] .flecha{transform:rotate(180deg)}
.secIn{padding:0 12px 14px}
.menu.uno{grid-template-columns:1fr;max-width:280px;margin:0 auto}
.vacioCaja{background:#fff;border:1.5px dashed #dcc9e2;border-radius:16px;padding:40px 16px;text-align:center;color:#9a8aa0}
.lista{display:flex;flex-direction:column;gap:1.4cqw;align-items:center;width:100%}
.itm{border:0;background:#fffaf3;border-radius:99px;padding:1.4cqw 3.5cqw;font:600 3.8cqw Quicksand,sans-serif;color:var(--txt);cursor:pointer;user-select:none;-webkit-user-select:none}
.itm.ok{text-decoration:line-through;opacity:.75}
.itm.lila{background:#e3cfe7}
/* Formularios */
.caja{background:#fff;border:1.5px solid #eadfd2;border-radius:16px;padding:14px;margin:12px 0}
label{display:block;font-weight:700;margin:10px 0 4px;color:var(--mor2)}
input[type=text],input[type=url],input[type=date],textarea,select{width:100%;padding:10px;border:1.5px solid #e2d4e6;border-radius:12px;font:inherit;color:inherit;background:#fffdfb}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid #dcc9e2;background:#fff;border-radius:99px;padding:6px 11px;cursor:pointer;font:600 .88rem Nunito,sans-serif;color:var(--txt)}
.chip.sel{background:var(--mor);border-color:var(--mor);color:#fff}
.num .chip{min-width:38px;text-align:center}
.colores .chip{width:40px;height:40px;padding:0}
.nota{background:#f3ecf6;border-radius:12px;padding:10px 12px;font-size:.9rem;margin:10px 0}
.oculto{display:none!important}
.volver{margin:4px 0 12px}
.pasos{font:700 .85rem Nunito,sans-serif;color:#a08aa8;margin-bottom:4px}
/* Respiración */
.resp{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.globo{width:260px;height:260px;display:grid;place-items:center;position:relative}
.bola{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3e3f6,#c9a3d3 60%,#a77bb4);box-shadow:0 0 0 14px #9a6aa61a,0 10px 30px #9a6aa640;transform:scale(1)}
.fase{position:absolute;font:700 1.4rem Fredoka,sans-serif;color:#fff;text-shadow:0 1px 4px #0004;text-align:center;pointer-events:none}
.fase small{display:block;font-size:1rem}
/* Lo que depende de mí */
.circulo{position:relative;width:100%;aspect-ratio:1;border-radius:50%;background:#e9dcef;display:flex;flex-direction:column;align-items:center;padding:6% 8%;margin:8px 0}
.circulo .afuera{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:88%;margin-bottom:4px}
.circulo .dentro{width:66%;scrollbar-width:none;aspect-ratio:1;border-radius:50%;background:var(--beige);border:3px solid var(--mor);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8%;gap:5px;margin:auto 0;overflow:auto}
.circulo b{font:700 .8rem Fredoka,sans-serif;color:var(--mor2)}
.pz{background:#fff;border-radius:99px;padding:2px 8px;font-size:.76rem;line-height:1.3;cursor:pointer;text-align:center}
.dentro .pz{background:#fff8}
/* Canciones */
.cancion{background:#fff;border:1.5px solid #eadfd2;border-radius:16px;padding:10px;margin:10px 0}
.cancion iframe{width:100%;border:0;border-radius:12px;display:block}
.cancion .nom{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;color:var(--mor2);margin-bottom:6px}
.cancion .nom button{border:0;background:#f3ecf6;border-radius:99px;padding:3px 8px;cursor:pointer}
/* Estadísticas */
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.stat div{background:#fff;border-radius:14px;padding:10px 6px;border:1.5px solid #eadfd2}
.stat b{display:block;font:700 1.5rem Fredoka,sans-serif;color:var(--mor2)}
.barra{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.9rem}
.barra span:first-child{flex:0 0 42%}
.barra i{display:block;height:12px;border-radius:99px;background:var(--mor)}
.crisis{font-size:.85rem;color:#8a7a90;text-align:center;margin-top:22px}
.modal{position:fixed;inset:0;background:#3a2a4055;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .caja{width:100%;max-width:520px;margin:0;border-radius:20px 20px 0 0;max-height:90vh;overflow:auto}
</style>
</head>
<body>
<header><img src="fichas/img/logo-sana.png" alt="Sana tu Mentte" onerror="this.remove()"><div><b>Mi kit emocional</b><small>Ábrelo cuando lo necesites 💛</small></div></header>
<main id="app"></main>

    {ref:'Salmo 139:13', v:'Porque tú formaste mis entrañas; tú me hiciste en el vientre de mi madre.'},
    {t:'Cuándo llamar a mi médico', s:1, p:'Llama a tu médico u obstetra, o ve a urgencias, si tienes: sangrado vaginal, pérdida de líquido, dolor abdominal fuerte o contracciones antes de tiempo, menos movimientos del bebé (si ya los sientes), dolor de cabeza fuerte que no cede, visión borrosa, hinchazón repentina de cara o manos, fiebre o vómitos que no te dejan tomar líquidos. Esta lista es general y no reemplaza a tu médico.'},
    {t:'Pedir ayuda es cuidarte', p:'Si la ansiedad es muy fuerte y dura varios días, o te quita el sueño o el apetito, cuéntaselo a tu médico y a tu psicóloga. Este kit es para calmarte, no para confirmar que el bebé está bien: para eso están tus controles.'}
   ], canciones:[]}
];
const FINAL = pags(41,43);
const EMOCIONES = ['Miedo','Ansiedad','Tristeza','Rabia','Culpa','Vergüenza','Soledad','Cansancio','Frustración','Ilusión','Calma'];
const USE_OPC = ['Respiré','Vi mis tarjetas','Escuché una canción','¿Y si…?','Lo que depende de mí','Carta compasiva','Oré'];

/* ===== Compartido como la cartilla: #<token>.<WhatsApp>[.<lo guardado en el caso>][.p = abierto en sesión] ===== */
const VISTA = location.hash==='#vista';
const ENL = VISTA?[]:(decodeURIComponent(location.hash.slice(1)).match(/^([A-Za-z0-9]{4,16})\.(\d{8,15})?(?:\.([A-Za-z0-9_-]*))?(\.p)?$/) || []);
let ULT = {}; try{ ULT = JSON.parse(localStorage.getItem('sana_kit_enlace')||'{}')||{}; }catch(e){}
if(ENL[1]){ ULT = {t:ENL[1], w:ENL[2]||ULT.w}; try{ localStorage.setItem('sana_kit_enlace', JSON.stringify(ULT)); }catch(e){} }
const TOKEN = ULT.t||'', EN_SESION = !!ENL[4];
const KEY = 'sana_kit_v1' + (TOKEN ? ':'+TOKEN : '');
const LISTAS = ['cartas','sesion','usos','escritos','ejercicios'];
const base = ()=>({cartas:[], extras:{}, sesion:[], usos:[], escritos:[], ejercicios:[], del:[]});
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hoyISO = ()=>{ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fechaBonita = f => { if(!f) return ''; const [y,m,d]=f.split('-'); return +d+' '+['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][m-1]+' '+y; };

/* Unir dos versiones sin perder nada: listas por id (gana la más reciente de cada elemento) y borrados (del) */
function unir(a,b){
  const o = base(); o.del = [...new Set([...(a.del||[]),...(b.del||[])])]; const del = new Set(o.del);
  const lista = (x,y)=>{ const m = new Map(); [...(x||[]),...(y||[])].forEach(it=>{ if(!it||!it.id) return; const v=m.get(it.id); if(!v||(+it._t||0)>=(+v._t||0)) m.set(it.id,it); }); return [...m.values()].filter(it=>!del.has(it.id)); };
  LISTAS.forEach(k=>o[k]=lista(a[k],b[k]));
  new Set([...Object.keys(a.extras||{}),...Object.keys(b.extras||{})]).forEach(k=>{ const x=(a.extras||{})[k]||{}, y=(b.extras||{})[k]||{};
    o.extras[k] = {frases:lista(x.frases,y.frases), canciones:lista(x.canciones,y.canciones), imagenes:lista(x.imagenes,y.imagenes)}; });
  o._t = Math.max(+a._t||0, +b._t||0); return o;
}
let estado = base();
if(!VISTA){ try{ const g = JSON.parse(localStorage.getItem(KEY)); if(g) estado = unir(base(), g); }catch(e){} }
let ACTUALIZADA = false;
if(ENL[3]){ try{ const b=ENL[3].replace(/-/g,'+').replace(/_/g,'/'), bin=atob(b+'==='.slice((b.length+3)%4));
  const o=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))));
  if(o&&typeof o==='object'){ const antes=JSON.stringify(estado); estado = unir(estado, o); ACTUALIZADA = !EN_SESION && antes!==JSON.stringify(base()) && antes!==JSON.stringify(estado);
    try{ localStorage.setItem(KEY, JSON.stringify(estado)); }catch(e){} } }catch(e){} }
if(VISTA){ const h=hoyISO();
  estado.escritos=[{id:'emb-recordar',t:'Sentir miedo por mi bebé no significa que algo vaya mal. Significa que lo amo.'}];
  estado.usos=[{id:'u1',f:h,carta:'embarazo',antes:7,desp:4,uso:['Respiré','¿Y si…?'],ayudo:'Sí'}]; }
const guardar = ()=>{ if(VISTA) return; estado._t = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(estado)); }catch(e){} };
const extras = id => { const e = estado.extras[id] = estado.extras[id] || {}; e.frases=e.frases||[]; e.canciones=e.canciones||[]; e.imagenes=e.imagenes||[]; return e; };
const todasCartas = ()=>[...KIT, ...estado.cartas.map(c=>({...c, tarjetas:[], canciones:[], propia:true}))];
const cartaPor = id => todasCartas().find(c=>c.id===id);
const escrito = id => (estado.escritos.find(x=>x.id===id)||{}).t||'';
const nomCarta = id=>{ const c=cartaPor(id); return c?c.cuando.replace(/^Cuando tu lucha sea con /,''):'Mi kit'; };

/* ===== Piezas con el diseño ===== */
const fondo = (tipo,color)=>`background-image:url(${IMG}${tipo}-${color}.jpg)`;
/* Portadas sin símbolos: todas iguales (fondo de su color + texto), así las cartas que crea el paciente se ven como las demás */
function portada(c){
  return `<div class="pag portada" style="${fondo('c',c.color)}"><div class="txt"><div class="abrelo">ÁBRELO</div><div class="cuando">${esc(c.cuando)}</div></div><div class="marca">@sanatumentte</div></div>`;
}
const pagTexto = (color, html, edit)=>`<div class="pag" style="${fondo('b',color)}">${edit||''}<div class="txt fit">${html}</div></div>`;
const botonesEd = (tipo,id,soloEditar,soloQuitar)=>`<div class="editar">${soloQuitar?'':`<button data-ed="${tipo}" data-id="${id}" title="Editar">✏️</button>`}${soloEditar?'':`<button data-del="${tipo}" data-id="${id}" title="Quitar">🗑</button>`}</div>`;
/* Tarjetas del kit (las que hizo la psicóloga), sus frases y sus imágenes */
const imgPag = (src,edit)=>`<div class="pag">${edit||''}<img src="${src}" alt="" loading="lazy" style="background:#fff;object-fit:contain"></div>`;
function kitTarjetas(c){
  return (c.tarjetas||[]).map(t=> t.img
    ? `<div class="pag"><img src="${IMG}${t.img}.jpg" alt="" loading="lazy">${t.link?`<a class="btn play" href="${esc(t.link[0])}" target="_blank" rel="noopener">${esc(t.link[1])}</a>`:''}</div>`
    : pagTexto(c.color, `${t.t?`<div class="t">${esc(t.t)}</div>`:''}${t.p?`<div class="p"${t.s?' style="--z:.78"':''}>${esc(t.p)}</div>`:''}${t.ref?`<div class="ref">${esc(t.ref)}</div>`:''}${t.v?`<div class="v">${esc(t.v)}</div>`:''}`));
}
function cardFrase(c,f){
  if(f.tipo==='control') return pagTexto(c.color, `${f.sit?`<div class="f">${esc(f.sit)}</div>`:''}<div class="t">En mis manos</div><div class="v">${(f.si||[]).map(x=>'✓ '+esc(x)).join('<br>')||'—'}</div><div class="sep">•••• ♥ ••••</div><div class="t">Lo entrego a Dios</div><div class="v">${(f.no||[]).map(esc).join(' · ')||'—'}</div>${f.hoy?`<div class="ref">Hoy: ${esc(f.hoy)}</div>`:''}`, botonesEd('frase',f.id,false,true));
  return pagTexto(c.color, `${f.tit?`<div class="t">${esc(f.tit)}</div>`:''}<div class="p">${esc(f.t)}</div>${f.ref?`<div class="ref">${esc(f.ref)}</div>`:''}`, botonesEd('frase',f.id,false,!!f.tipo));
}
const misFrases = c=>extras(c.id).frases.map(f=>cardFrase(c,f));
const misImagenes = c=>[...FINAL.map(p=>imgPag(IMG+p+'.jpg')), ...extras(c.id).imagenes.map(m=>imgPag(m.src, botonesEd('imagen',m.id,false,true)))];
const tarjetasDe = c=>[...kitTarjetas(c), ...misFrases(c)];
/* Guardar en «Ver mis tarjetas» lo que sale de un ejercicio */
function botonGuardarTarjeta(item){
  if(!vista.carta) return '';
  setTimeout(()=>{ const b=document.getElementById('aTarj'); if(b) b.onclick=()=>{ extras(vista.carta).frases.push({id:uid(),_t:Date.now(),...item}); guardar(); b.textContent='✓ Guardada en mis tarjetas'; b.disabled=true; }; });
  return '<button class="btn" id="aTarj">⭐ Guardar en mis tarjetas</button>';
}
/* El texto siempre cabe: se achica un poco y, si aún es largo, la tarjeta se puede deslizar */
function ajustar(raiz){
  (raiz||document).querySelectorAll('.txt.fit').forEach(t=>{ const pag=t.parentElement; let z=1;
    pag.style.setProperty('--z',1); t.classList.remove('scroll');
    while(t.scrollHeight>t.clientHeight+1 && z>0.62){ z-=0.04; pag.style.setProperty('--z',z.toFixed(2)); }
    if(t.scrollHeight>t.clientHeight+1) t.classList.add('scroll'); });
}

/* ===== Pantallas ===== */
const app = document.getElementById('app');
let vista = {v:'inicio'};
function ir(v){ pararResp(); vista = v; pintar(); window.scrollTo(0,0); }
function pintar(){
  const c = vista.id && cartaPor(vista.id);
  if(vista.v==='carta'&&c) return pintarMenu(c);
  if(vista.v==='ver'&&c) return pintarVer(c);
  if(vista.v==='oir'&&c) return pintarOir(c);
  if(vista.v==='resp') return pintarResp();
  if(vista.v==='ysi') return pintarYsi();
  if(vista.v==='control') return pintarControl();
  if(vista.v==='comp') return pintarComp();
  if(vista.v==='frase'&&c) return pintarFrase(c);
  if(vista.v==='sesion') return pintarSesion();
  if(vista.v==='stats') return pintarStats();
  if(vista.v==='nueva') return pintarNueva(vista.id);
  pintarInicio();
}
const volverA = (txt,v)=>`<button class="btn sec sm volver" data-ir="${v.v}" ${v.id?`data-id="${v.id}"`:''}>← ${txt}</button>`;
const volverCarta = ()=> vista.carta ? volverA(nomCarta(vista.carta).replace(/^./,m=>m.toUpperCase()),{v:'carta',id:vista.carta}) : volverA('Mi kit',{v:'inicio'});

function pintarInicio(){
  const aviso = EN_SESION ? '🩺 <b>Modo sesión:</b> se abrió con lo último guardado en el caso. Al terminar, toca «📋 Copiar para enviar a mi psicóloga».'
    : ACTUALIZADA ? '✨ <b>Tu kit se actualizó</b> con lo nuevo que trabajaste con tu psicóloga.' : VISTA ? '👁 <b>Vista previa</b> con un ejemplo: no se guarda nada.' : '';

    <h2>Ábrelo cuando lo necesites</h2>

/* Menú de la carta: secciones que se despliegan (Ver · Escuchar · Mi cuerpo · Hacer) */
function pintarMenu(c){
  const nF = extras(c.id).frases.length, nI = FINAL.length + extras(c.id).imagenes.length, nK = (c.tarjetas||[]).length;
  const nC = (c.canciones||[]).length + extras(c.id).canciones.length;
  const abierta = k=>(vista.abierta||'')===k?' open':'';
  const sec = (k,ico,tit,sub,cuerpo)=>`<details class="seccion" data-sec="${k}"${abierta(k)}><summary><i>${ico}</i><span>${tit}<small>${sub}</small></span><b class="flecha">▾</b></summary><div class="secIn">${cuerpo}</div></details>`;

      ${boton(`data-ir="ver" data-id="${c.id}" data-que="frases"`,'💌','Mis frases', nF?`${nF} frase${nF===1?'':'s'}`:'Aún no hay')}
      ${boton(`data-ir="ver" data-id="${c.id}" data-que="imagenes"`,'🖼️','Mis imágenes', `${nI} imagen${nI===1?'':'es'}`)}
      ${nK?boton(`data-ir="ver" data-id="${c.id}" data-que="kit"`,'📖','Tarjetas del kit', `${nK} tarjeta${nK===1?'':'s'}`):''}</div>`)}
    ${sec('oir','👂','Escuchar', `${nC} canci${nC===1?'ón':'ones'}`, `<div class="menu uno">${boton(`data-ir="oir" data-id="${c.id}"`,'🎵','Escuchar mis canciones','O agregar una nueva')}</div>`)}
    ${sec('cuerpo','🫁','Mi cuerpo','Calmarme desde el cuerpo', `<div class="menu uno">${boton('data-ir="resp"','🫁','Respirar','Con la bolita y música suave')}</div>`)}
    ${sec('hacer','✍️','Hacer','Un ejercicio para este momento', `<div class="menu">
      ${boton(`data-ir="frase" data-id="${c.id}"`,'✍️','Escribir mi frase','Con título')}
      ${boton('data-ir="ysi"','🌪️','¿Y si…?','Ponerlo a prueba')}
      ${boton('data-ir="control"','🤲','Lo que depende de mí','En mis manos')}
      ${boton('data-ir="comp"','💗','Carta compasiva','Hablarme con ternura')}</div>`)}
    ${formUso(c.id)}
    ${c.propia?`<div class="fila"><button class="btn sec sm" data-ir="nueva" data-id="${c.id}">✏️ Cambiar título o color</button><button class="btn sec sm" data-del="carta" data-id="${c.id}">🗑 Quitar esta carta</button></div>`:''}`;
  vista.carta = c.id;
  document.querySelectorAll('details.seccion').forEach(d=>d.addEventListener('toggle',()=>{ if(d.open){ vista.abierta=d.dataset.sec; document.querySelectorAll('details.seccion').forEach(o=>{ if(o!==d) o.open=false; }); } }));
  enlazar(); enlazarUso(c.id);
}

/* 👀 Ver: una a una — sus frases, sus imágenes (puede subir nuevas) o las tarjetas del kit */
function pintarVer(c){
  const que = vista.que||'frases';
  const L = que==='imagenes'?misImagenes(c):que==='kit'?kitTarjetas(c):misFrases(c);
  const TIT = {frases:'💌 Mis frases', imagenes:'🖼️ Mis imágenes', kit:'📖 Tarjetas del kit'}[que];
  let i = Math.min(vista.i||0, Math.max(0,L.length-1));
  app.innerHTML = `${volverA('Volver',{v:'carta',id:c.id})}<h2 style="text-align:center">${TIT}</h2>
    <div class="visor" id="visor"></div>
    ${L.length>1?'<div class="visorNav"><button class="btn sec" id="vAnt">← Anterior</button><span id="vNum"></span><button class="btn" id="vSig">Siguiente →</button></div>':''}
    <div class="fila" style="justify-content:center;margin-top:12px">
      ${que==='frases'?`<button class="btn" data-ir="frase" data-id="${c.id}">✍️ Escribir una frase</button>`:''}
      ${que==='imagenes'?'<label class="btn" style="margin:0">📷 Subir una imagen<input type="file" id="subImg" accept="image/*" hidden></label>':''}</div>
    ${que==='imagenes'?'<p class="hint" style="text-align:center">Las imágenes quedan guardadas solo en tu celular.</p>':''}`;
  const v=document.getElementById('visor');
  const mostrar = ()=>{ vista.i=i;
    v.innerHTML = L[i] || `<div class="vacioCaja">${que==='frases'?'Aún no has escrito frases en esta carta.<br>Escribe una o guarda la de un ejercicio con ⭐.':'Aún no hay imágenes.'}</div>`;
    if(L.length>1){ vNum.textContent=`${i+1} / ${L.length}`; vAnt.disabled=i<=0; vSig.disabled=i>=L.length-1; }
    ajustar(v); enlazar(v); };
  if(L.length>1){ vAnt.onclick=()=>{ if(i>0){ i--; mostrar(); } }; vSig.onclick=()=>{ if(i<L.length-1){ i++; mostrar(); } };
    let x0=null; v.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; },{passive:true});
    v.addEventListener('touchend',e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>50){ dx<0?vSig.onclick():vAnt.onclick(); } }); }
  enlazar(); mostrar();
  const inp=document.getElementById('subImg');
  if(inp) inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const im=new Image(), r=new FileReader();
    r.onload=()=>{ im.onload=()=>{ const k=Math.min(1,900/Math.max(im.width,im.height)), cv=document.createElement('canvas'); cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      extras(c.id).imagenes.push({id:uid(),_t:Date.now(),src:cv.toDataURL('image/jpeg',.8)});
      try{ guardar(); }catch(e){} vista.i=misImagenes(c).length-1; pintar(); }; im.src=r.result; }; r.readAsDataURL(f); };
}

/* 🎵 Escuchar: con la portada y el reproductor de YouTube o Spotify cuando se puede */
function embed(u){
  let m = u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/);
  if(m) return `<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" height="200" allow="encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
  m = u.match(/open\.spotify\.com\/(?:intl-\w+\/)?(track|album|playlist|episode)\/(\w+)/);
  if(m) return `<iframe src="https://open.spotify.com/embed/${m[1]}/${m[2]}" height="152" allow="encrypted-media" loading="lazy"></iframe>`;
  return `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">▶️ Escuchar</a>`;
}

  enlazar();

/* ✍️ Escribir mi frase: título (puede elegir una guía) + frase, con vista previa; se guarda en «Mis frases» */
const GUIAS_BASE = [{t:'Lo que quiero recordarme', guia:'Escribe una frase tuya, con tus palabras.'},{t:'¿Qué siento ahora?', guia:'Ponle nombre a lo que sientes y dónde lo notas en tu cuerpo.'},{t:'Lo que me ayuda', guia:'¿Qué te ha servido otras veces en un momento así?'}];
function pintarFrase(c){
  const ed = vista.editar && extras(c.id).frases.find(f=>f.id===vista.editar) || {};
  const G = c.guias || GUIAS_BASE;
  app.innerHTML = `${volverA('Volver',{v:'carta',id:c.id})}<h2>✍️ ${ed.id?'Editar mi frase':'Escribir mi frase'}</h2>
    <div class="caja">${ed.id?'':`<label>Elige una idea (o escribe tu propio título)</label><div class="chips" id="fGu">${G.map((g,i)=>`<button class="chip" data-i="${i}">${esc(g.t)}</button>`).join('')}</div><p class="hint" id="fGuia"></p>`}
      <label>Título</label><input type="text" id="fTit" value="${esc(ed.tit||'')}" placeholder="Ej.: Lo que quiero recordarme">
      <label>Mi frase</label><textarea id="fTxt" placeholder="Escríbela con tus palabras">${esc(ed.t||'')}</textarea>
      <label>Versículo (opcional)</label><input type="text" id="fRef" value="${esc(ed.ref||'')}" placeholder="Ej.: Salmo 56:3">

const ACORDES = [[73.42,146.83,220,329.63,369.99],[61.74,123.47,185,293.66,329.63],[49,98,146.83,246.94,369.99],[55,110,164.81,246.94,329.63]]; /* Re mayor: uno por respiración */

function musica(){ /* acordes suaves con eco: suben y se aclaran al inhalar, bajan y se apagan al exhalar */
  despertarAudio(); if(AUDIO) return AUDIO; const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return null;
  const ctx = new AC(), comp = ctx.createDynamicsCompressor(), master = ctx.createGain(), nivel = ctx.createGain(), filtro = ctx.createBiquadFilter(),
    eco = ctx.createConvolver(), seco = ctx.createGain(), mojado = ctx.createGain();

function curva(p, desde, hasta, seg, t){ const k=40, c=new Float32Array(k);

    <label>¿Qué usé?</label><div class="chips" id="usoQue">${USE_OPC.map(o=>`<button class="chip">${esc(o)}</button>`).join('')}<button class="chip" id="usoOtroB">✏️ Otro</button></div>
    <input type="text" id="usoOtro" class="oculto" placeholder="¿Qué más usaste?" style="margin-top:6px">
    <label>¿Y después? (0–10)</label>${num('desp')}
    <label>Después, ¿pude hacer lo que me importa?</label><div class="chips" id="usoAy">${['Sí','Un poco','No'].map(o=>`<button class="chip">${o}</button>`).join('')}</div>
    <label>Nota (opcional)</label><input type="text" id="usoNota">
    <div class="fila"><button class="btn" id="usoOk">Guardar</button></div><div id="usoMsg"></div></details>`;
}
function enlazarUso(cartaId){
  const r = {};
  document.querySelectorAll('#uso [data-num]').forEach(g=>g.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ g.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); r[g.dataset.num]=+b.dataset.v; }));
  document.querySelectorAll('#usoQue .chip:not(#usoOtroB)').forEach(b=>b.onclick=()=>b.classList.toggle('sel'));
  usoOtroB.onclick = e=>{ e.target.classList.toggle('sel'); usoOtro.classList.toggle('oculto', !e.target.classList.contains('sel')); };
  document.querySelectorAll('#usoAy .chip').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#usoAy .chip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); r.ayudo=b.textContent; });
  usoOk.onclick = ()=>{
    const uso=[...document.querySelectorAll('#usoQue .chip.sel:not(#usoOtroB)')].map(b=>b.textContent); if(usoOtro.value.trim()) uso.push(usoOtro.value.trim());
    if(r.antes==null&&!uso.length){ usoMsg.innerHTML='<div class="nota">Marca al menos el malestar o lo que usaste.</div>'; return; }
    estado.usos.push({id:uid(), _t:Date.now(), f:hoyISO(), carta:cartaId, antes:r.antes, desp:r.desp, uso, ayudo:r.ayudo||'', nota:usoNota.value.trim()});
    guardar(); document.querySelectorAll('#uso .chip.sel').forEach(x=>x.classList.remove('sel')); document.querySelectorAll('#uso input').forEach(x=>x.value='');
    Object.keys(r).forEach(k=>delete r[k]); usoMsg.innerHTML='<div class="nota">✅ Guardado. Bien hecho por cuidarte 💛</div>';
  };
}

/* 🌱 Lo que me llevo de sesión: solo lo esencial de cada ejercicio (la plantilla completa queda en el cuaderno de cierre) */
function pintarSesion(){
  const L = [...estado.sesion].sort((a,b)=>(b.f||'').localeCompare(a.f||''));
  const ed = vista.editar && estado.sesion.find(x=>x.id===vista.editar) || {};
  app.innerHTML = `${volverA('Mi kit',{v:'inicio'})}<h2>🌱 Lo que me llevo de sesión</h2>
    <p class="hint">Lo que me sirvió de cada ejercicio, para tenerlo a la mano.</p>
    <div class="visor" id="visor"></div>
    ${L.length>1?'<div class="visorNav"><button class="btn sec" id="vAnt">← Anterior</button><span id="vNum"></span><button class="btn" id="vSig">Siguiente →</button></div>':''}
    <details class="caja" ${ed.id||!L.length?'open':''}><summary><b>${ed.id?'✏️ Editar':'➕ Agregar lo que me llevo'}</b></summary>
      <label>Ejercicio o tema</label><input type="text" id="sEj" value="${esc(ed.ej||'')}" placeholder="Ej.: ¿Y si…?, carta compasiva…">
      <label>La frase que realmente me sirvió</label><textarea id="sFr">${esc(ed.frase||'')}</textarea>
      <label>Lo que me ayudó</label><input type="text" id="sAy" value="${esc(ed.ayudo||'')}">
      <label>¿Cuándo usarlo?</label><input type="text" id="sCu" value="${esc(ed.cuando||'')}" placeholder="Ej.: cuando me llegan los «¿y si…?»">
      <label>Fecha</label><input type="date" id="sF" value="${esc(ed.f||hoyISO())}">
      <div class="fila"><button class="btn" id="sOk">Guardar</button></div></details>`;
  enlazar();
  const tarj = s=>pagTexto('menta', `<div class="f">${esc(fechaBonita(s.f))} · ${esc(s.ej||'Sesión')}</div>${s.frase?`<div class="t" style="font-size:calc(5.4cqw*var(--z))">«${esc(s.frase)}»</div>`:''}${s.ayudo?`<div class="p" style="font-size:calc(4cqw*var(--z))"><b>Lo que me ayudó:</b> ${esc(s.ayudo)}</div>`:''}${s.cuando?`<div class="ref">Úsalo: ${esc(s.cuando)}</div>`:''}`, botonesEd('sesion',s.id));
  let i=0; const v=document.getElementById('visor');
  const mostrar=()=>{ v.innerHTML = L.length?tarj(L[i]):'<p class="hint">Aquí irán apareciendo las frases y lo que te ayudó de lo que trabajamos en sesión.</p>'; ajustar(v); enlazar(v);
    if(L.length>1){ vNum.textContent=`${i+1} / ${L.length}`; vAnt.disabled=i<=0; vSig.disabled=i>=L.length-1; } };
  if(L.length>1){ vAnt.onclick=()=>{ if(i>0){ i--; mostrar(); } }; vSig.onclick=()=>{ if(i<L.length-1){ i++; mostrar(); } }; }
  mostrar();
  sOk.onclick = ()=>{ const val = {ej:sEj.value.trim(), frase:sFr.value.trim(), ayudo:sAy.value.trim(), cuando:sCu.value.trim(), f:sF.value||hoyISO(), _t:Date.now()};
    if(!val.frase&&!val.ayudo) return;
    if(ed.id) Object.assign(ed,val); else estado.sesion.push({id:uid(),...val});
    vista.editar=null; guardar(); pintar(); };
}

function pintarNueva(id){
  const c = id && estado.cartas.find(x=>x.id===id) || {cuando:'Cuando tu lucha sea con ', color:'lila', ic:'💛'};
  const ICS = ['💛','🌧️','😰','💔','👶','🏠','💼','🙏','🌱','🔥','😔','👨‍👩‍👧'];
  app.innerHTML = `${volverA('Mi kit',{v:'inicio'})}<h2>${id?'Cambiar mi carta':'Nueva carta'}</h2>
    <div class="caja"><label>Título</label><input type="text" id="cT" value="${esc(c.cuando)}">
      <label>Color</label><div class="chips colores">${Object.entries(COLORES).map(([k,v])=>`<button class="chip${k===c.color?' sel':''}" data-c="${k}" style="background:${v}" title="${k}"></button>`).join('')}</div>
      <div class="hint" style="margin-top:12px">👁 Vista previa</div><div id="cPrev" style="max-width:240px"></div>
      <div class="fila"><button class="btn" id="cOk">${id?'Guardar':'Crear y abrir'}</button></div></div>`;
  enlazar();
  const prev = ()=>{ cPrev.innerHTML = portada(c); };
  cT.oninput = e=>{ c.cuando=e.target.value; prev(); };
  document.querySelectorAll('.colores .chip').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.colores .chip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); c.color=b.dataset.c; prev(); });
  document.querySelectorAll('#cIc .chip').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#cIc .chip').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); c.ic=b.textContent; prev(); });
  prev();
  cOk.onclick = ()=>{ if(!c.cuando.trim()) return; if(!id){ c.id=uid(); estado.cartas.push(c); } c._t=Date.now(); guardar(); ir({v:'carta', id:c.id}); };
}

/* 📊 Estadísticas de la semana o el mes */
function pintarStats(){
  const per = vista.per||'semana', dias = per==='semana'?7:30, desde = new Date(Date.now()-dias*864e5).toISOString().slice(0,10);
  const U = estado.usos.filter(u=>(u.f||'')>=desde), E = estado.ejercicios.filter(e=>(e.f||'')>=desde);
  const prom = k=>{ const L=U.filter(u=>u[k]!=null); return L.length?(L.reduce((s,u)=>s+u[k],0)/L.length).toFixed(1):'–'; };
  const cuenta = arr=>{ const m={}; arr.forEach(x=>m[x]=(m[x]||0)+1); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const barras = L=>{ const mx=Math.max(1,...L.map(x=>x[1])); return L.slice(0,6).map(([k,n])=>`<div class="barra"><span>${esc(k)}</span><i style="width:${n/mx*50}%"></i><span>${n}</span></div>`).join('') || '<p class="hint">Todavía no hay registros.</p>'; };
  const NOM = {resp:'🫁 Respirar', ysi:'🌪️ ¿Y si…?', control:'⭕ Lo que depende de mí', comp:'💗 Carta compasiva'};
  app.innerHTML = `${volverA('Mi kit',{v:'inicio'})}<h2>📊 Mis estadísticas</h2>
    <div class="chips" style="margin-bottom:12px"><button class="chip${per==='semana'?' sel':''}" data-per="semana">Esta semana</button><button class="chip${per==='mes'?' sel':''}" data-per="mes">Este mes</button></div>
    <div class="stat"><div><b>${E.length}</b>ejercicios hechos</div><div><b>${prom('antes')}</b>malestar antes</div><div><b>${prom('desp')}</b>malestar después</div></div>
    <h3>Los ejercicios que más hice</h3>${barras(cuenta(E.map(e=>NOM[e.tipo]||e.tipo)))}
    <h3>Las cartas que más abrí</h3>${barras(cuenta([...U.map(u=>u.carta),...E.filter(e=>e.carta).map(e=>e.carta)].map(nomCarta)))}
    <h3>Lo que usé cuando sí pude seguir con mi día</h3>${barras(cuenta(U.filter(u=>u.ayudo==='Sí'||u.ayudo==='Un poco').flatMap(u=>u.uso||[])))}
    <h3>Mis registros</h3>${U.length?[...U].reverse().map(u=>`<div class="nota">${esc(fechaBonita(u.f))} · <b>${esc(nomCarta(u.carta))}</b> · ${u.antes??'–'} → ${u.desp??'–'}${u.ayudo?' · '+esc(u.ayudo):''}<br><small>${esc((u.uso||[]).join(', '))}${u.nota?' — '+esc(u.nota):''}</small> <button class="chip" data-del="uso" data-id="${u.id}" style="padding:1px 8px">🗑</button></div>`).join(''):'<p class="hint">Al final de cada carta puedes anotar cómo te fue.</p>'}`;
  enlazar();
  document.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{ vista.per=b.dataset.per; pintar(); });
}

/* Ventana para escribir (tarjetas para escribir y editar canciones) */
function escribir(titulo, guia, valor, alGuardar){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="caja"><b>${esc(titulo)}</b>${guia?`<p class="hint">${esc(guia)}</p>`:''}<textarea id="mTxt" style="min-height:110px">${esc(valor||'')}</textarea>
    <div class="fila" style="justify-content:flex-end"><button class="btn sec" id="mNo">Cancelar</button><button class="btn" id="mSi">Guardar</button></div></div>`;
  document.body.appendChild(m); const t=m.querySelector('#mTxt'); t.focus({preventScroll:true});
  m.querySelector('#mNo').onclick=()=>m.remove(); m.onclick=e=>{ if(e.target===m) m.remove(); };
  m.querySelector('#mSi').onclick=()=>{ alGuardar(t.value.trim()); m.remove(); };
}

/* Botones comunes: navegar, editar y quitar */
function enlazar(raiz){
  raiz = raiz||app;
  raiz.querySelectorAll('[data-ir]').forEach(b=>b.onclick=()=>{ const v={v:b.dataset.ir}; if(b.dataset.id) v.id=b.dataset.id; if(b.dataset.que) v.que=b.dataset.que; if(b.dataset.carta!=null) v.carta=b.dataset.carta; else if(vista.carta&&['resp','ysi','control','comp'].includes(v.v)) v.carta=vista.carta; ir(v); });
  raiz.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!b.dataset.ok){ b.dataset.ok='1'; const t=b.textContent; b.textContent='¿Seguro?'; setTimeout(()=>{ delete b.dataset.ok; b.textContent=t; },4000); return; }
    estado.del.push(b.dataset.id); estado = unir(estado, base()); guardar();
    if(b.dataset.del==='carta') ir({v:'inicio'}); else pintar(); });
  raiz.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id, tipo=b.dataset.ed, c=vista.id&&cartaPor(vista.id);
    if(tipo==='sesion'){ vista.editar=id; pintar(); return; }
    if(tipo==='frase'){ vista.editar=id; ir({v:'frase', id:vista.id, editar:id}); return; }
    if(tipo==='escrito'){ const t=(c&&c.tarjetas||[]).find(x=>x.id===id)||{};
      escribir(t.t||'Escribe', t.guia, escrito(id), val=>{ const it=estado.escritos.find(x=>x.id===id); if(it) Object.assign(it,{t:val,_t:Date.now()}); else estado.escritos.push({id,t:val,_t:Date.now()}); guardar(); pintar(); }); return; }
    if(tipo==='cancion'){ const it=extras(vista.id).canciones.find(x=>x.id===id); if(!it) return;
      escribir('Enlace de la canción', it.n, it.u, val=>{ if(!val) return; it.u=/^https?:\/\//i.test(val)?val:'https://'+val; it._t=Date.now(); guardar(); pintar(); }); } });
  raiz.querySelectorAll('#btnWa').forEach(a=>a.onclick=()=>{ a.href='https://api.whatsapp.com/send?phone='+MI_WA+'&text='+encodeURIComponent(mensajeSana()); });
  raiz.querySelectorAll('#btnCopiar').forEach(b=>b.onclick=()=>{
    const msg = mensajeSana(), av = document.getElementById('platAviso');
    const manual = ()=>{ av.innerHTML='Copia este texto y envíalo por WhatsApp a tu psicóloga:<textarea readonly style="margin-top:6px">'+esc(msg)+'</textarea>'; };
    try{ navigator.clipboard.writeText(msg).then(()=>{ av.innerHTML='<div class="nota">✅ Copiado. Pégalo en el chat de WhatsApp con tu psicóloga.</div>'; }, manual); }catch(e){ manual(); } });
}

/* ===== Envío a la psicóloga (SANA1 compartido, k:'c') ===== */
const MI_WA = ULT.w || '573150898447';
function envio(){
  return `<div class="caja" style="text-align:center;margin-top:18px"><b>💌 Compartir mi kit con mi psicóloga</b>
    <p class="hint">Envía lo que agregaste y tus ejercicios. Todo sigue guardado en tu celular.</p>
    <div class="fila" style="justify-content:center"><a class="btn wa" id="btnWa" href="#" target="_blank" rel="noopener">📲 Enviar a mi psicóloga por WhatsApp</a>
    <button class="btn sec" id="btnCopiar">📋 Copiar para enviar a mi psicóloga</button></div><div id="platAviso"></div></div>
    <p class="crisis">Si estás en peligro o piensas en hacerte daño, llama ya a ${esc(lineaCrisis())} o acude a urgencias.</p>`;
}
function mensajeSana(){
  const res = [], linea = (e)=>{
    if(e.tipo==='resp') return `🫁 Respiró ${e.veces||''} veces`;
    if(e.tipo==='ysi') return `🌪️ ¿Y si ${e.ysi||''}? · Peor: ${e.peor||'–'} · Mejor: ${e.mejor||'–'} · Lo más probable: ${e.prob||'–'} · Si pasara: ${e.puedo||'–'} · Frase: ${e.frase||'–'} · Ahora: ${e.ahora||'–'}`;
    if(e.tipo==='control') return `⭕ ${e.sit||''} · Sí depende: ${(e.si||[]).join(', ')||'–'} · No depende: ${(e.no||[]).join(', ')||'–'} · Hoy: ${e.hoy||'–'}`;
    if(e.tipo==='comp') return `💗 Le duele: ${e.duele||'–'} · ${e.comun||''} · A una amiga: ${e.amiga||'–'} · Su frase: ${e.frase||'–'}`;
    return e.tipo; };
  if(estado.sesion.length) res.push({label:'🌱 Lo que me llevo de sesión', val:estado.sesion.map(s=>`• ${fechaBonita(s.f)} · ${s.ej||'Sesión'}: «${s.frase||''}»${s.ayudo?' — Me ayudó: '+s.ayudo:''}${s.cuando?' — Úsalo: '+s.cuando:''}`).join('\n')});
  const E = estado.ejercicios.slice(-30);
  if(E.length) res.push({label:'🧰 Ejercicios que hice', val:E.map(e=>`• ${fechaBonita(e.f)}${e.carta?' · '+nomCarta(e.carta):''} · ${linea(e)}`).join('\n')});
  const U = estado.usos.slice(-30);
  if(U.length) res.push({label:'📝 ¿Cómo me fue?', val:U.map(u=>`• ${fechaBonita(u.f)} · ${nomCarta(u.carta)} · malestar ${u.antes??'–'} → ${u.desp??'–'}${u.ayudo?' · pudo hacer lo que le importa: '+u.ayudo:''}${(u.uso||[]).length?' · usó: '+u.uso.join(', '):''}${u.nota?' · '+u.nota:''}`).join('\n')});
  const W = estado.escritos.filter(x=>x.t); if(W.length) res.push({label:'✍️ Lo que escribí en mis tarjetas', val:W.map(x=>{ const t=KIT.flatMap(c=>c.tarjetas||[]).find(y=>y.id===x.id); return `• ${t?t.t:x.id}: ${x.t}`; }).join('\n')});
  const nuevas = todasCartas().map(c=>{ const ex=estado.extras[c.id]; if(!ex||(!ex.frases.length&&!ex.canciones.length)) return ''; return `${c.cuando}:\n${ex.frases.map(f=>'  ✍️ '+(f.tit?f.tit+': ':'')+f.t+(f.ref?' ('+f.ref+')':'')).join('\n')}${ex.canciones.length?'\n'+ex.canciones.map(s=>'  🎵 '+(s.n||s.u)).join('\n'):''}`; }).filter(Boolean);
  if(estado.cartas.length) res.push({label:'💌 Mis cartas nuevas', val:estado.cartas.map(c=>'• '+c.cuando).join('\n')});
  if(nuevas.length) res.push({label:'⭐ Frases y canciones que agregué', val:nuevas.join('\n')});
  const s = JSON.parse(JSON.stringify(estado)); Object.values(s.extras||{}).forEach(e=>delete e.imagenes);   /* las imágenes pesan mucho: quedan en su celular */
  const o = {v:1,k:'c',c:'kit',f:hoyISO(),res,s}; if(TOKEN) o.t = TOKEN;
  return '💛 Mi kit emocional «Ábrelo»\nSANA1:z'+LZString.compressToEncodedURIComponent(JSON.stringify(o));
}
/* Línea de crisis según la zona horaria del celular (sin pedir ubicación) */
function lineaCrisis(){ let z=''; try{ z=Intl.DateTimeFormat().resolvedOptions().timeZone||''; }catch(e){}
  const L=[[/^America\/Bogota$/,'la Línea 123 (Colombia)'],[/^America\/(New_York|Chicago|Denver|Phoenix|Los_Angeles|Anchorage|Detroit|Indiana|Kentucky|Boise|Adak)|^Pacific\/Honolulu$/,'la línea 988 (Estados Unidos: llama o escribe; marca 2 para español)'],
    [/^America\/(Toronto|Vancouver|Edmonton|Winnipeg|Halifax|Regina|St_Johns)$/,'la línea 988 (Canadá)'],[/^America\/(Mexico_City|Monterrey|Merida|Cancun|Chihuahua|Hermosillo|Mazatlan|Tijuana|Matamoros|Bahia_Banderas)$/,'la línea 911 (México)'],
    [/^(Europe\/Madrid|Atlantic\/Canary|Africa\/Ceuta)$/,'la línea 024 (España)'],[/^America\/Guayaquil$/,'la línea 911 (Ecuador)'],[/^America\/Lima$/,'la Línea 113, opción 5 (Perú)'],[/^America\/Santiago$/,'la línea *4141 (Chile)']];
  const m=L.find(([r])=>r.test(z)); return m?m[1]:'la línea de emergencias de tu país'; }
window.addEventListener('resize', ()=>ajustar());
pintar();
</script>
